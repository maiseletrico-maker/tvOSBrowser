name: Build tvOS Browser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

          echo "Xcode path:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

      - name: Find Xcode project
        run: |
          echo "Searching for Xcode project..."

          find . -type d -name "*.xcodeproj" -print

          PROJECT=$(find . -type d -name "Browser.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Browser.xcodeproj not found"
            exit 1
          fi

          echo ""
          echo "FOUND PROJECT:"
          echo "$PROJECT"

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: List project schemes
        run: |
          echo "======================================"
          echo "PROJECT INFORMATION"
          echo "======================================"

          echo "Project:"
          echo "$PROJECT_PATH"

          echo ""

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      - name: Build
        run: |
          echo "======================================"
          echo "STARTING BUILD"
          echo "======================================"

          echo "Project:"
          echo "$PROJECT_PATH"

          echo ""

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "Browser" \
            -sdk appletvos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Show build result
        if: always()
        run: |
          echo "======================================"
          echo "BUILD DIRECTORY"
          echo "======================================"

          find "$GITHUB_WORKSPACE/build" \
            -maxdepth 8 \
            -print 2>/dev/null || true

          echo ""

          echo "======================================"
          echo "APP FILES"
          echo "======================================"

          find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -print 2>/dev/null || true

      - name: Package IPA
        run: |
          set -e

          echo "Searching for application..."

          APP=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo ""
            echo "ERROR: No .app was generated."
            echo ""
            echo "Build contents:"
            find "$GITHUB_WORKSPACE/build" -maxdepth 8 -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "FOUND APPLICATION:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Browser.app

          zip -r Browser-unsigned.ipa Payload

          echo ""
          echo "IPA CREATED:"
          ls -lh Browser-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: Browser-unsigned
          path: Browser-unsigned.ipa
