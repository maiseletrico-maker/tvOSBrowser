name: Find tvOS Browser Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Show repository
        run: |
          echo "================================="
          echo "CURRENT DIRECTORY"
          echo "================================="
          pwd

          echo ""
          echo "================================="
          echo "FILES"
          echo "================================="
          find . -maxdepth 5 -print | sort

          echo ""
          echo "================================="
          echo "XCODE PROJECTS"
          echo "================================="
          find . -type d -name "*.xcodeproj" -print

          echo ""
          echo "================================="
          echo "XCODE WORKSPACES"
          echo "================================="
          find . -type d -name "*.xcworkspace" -print

      - name: Check Xcode
        run: |
          echo "================================="
          echo "XCODE"
          echo "================================="

          ls -la /Applications/ | grep Xcode || true

          echo ""
          xcodebuild -version
