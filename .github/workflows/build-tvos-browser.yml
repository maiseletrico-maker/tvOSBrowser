name: Build tvOS Browser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Find Xcode project
        run: |
          PROJECT=$(find . -type d -name "tvOSBrowser.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: tvOSBrowser.xcodeproj was not found."
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT"

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: List schemes
        run: |
          echo "Project:"
          echo "$PROJECT_PATH"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      - name: Build
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "tvOSBrowser" \
            -sdk appletvos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log

      - name: Find application
        run: |
          echo "Searching for .app..."

          APP=$(find build -type d -path "*/Release-appletvos/*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."
            find build -maxdepth 8 -print || true
            exit 1
          fi

          echo "Application found:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/tvOSBrowser.app

          zip -r tvOSBrowser-unsigned.ipa Payload

          echo ""
          echo "IPA created:"
          ls -lh tvOSBrowser-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: tvOSBrowser-unsigned
          path: tvOSBrowser-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
